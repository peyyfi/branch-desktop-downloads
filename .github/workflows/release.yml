name: Publish desktop installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release containing branch-desktop-build.zip
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: windows-latest
            platform: win
            arch: arm64
          - os: windows-latest
            platform: win
            arch: ia32
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the reviewed desktop build input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(python -c "import json;print(json.load(open('release-input.json'))['releaseId'])")"
          asset_id="$(python -c "import json;print(json.load(open('release-input.json'))['inputAssetId'])")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')" = true
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --header 'Accept: application/octet-stream' > branch-desktop-build.zip
          python -c "import hashlib,json,os,zipfile; from pathlib import Path; m=json.loads(Path('release-input.json').read_text()); assert m['tag']==os.environ['RELEASE_TAG']; assert hashlib.sha256(Path('branch-desktop-build.zip').read_bytes()).hexdigest()==m['sha256']; zipfile.ZipFile('branch-desktop-build.zip').extractall('.')"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop test
      - name: Build the native installer
        run: npm --prefix desktop run release -- ${{ matrix.platform }} ${{ matrix.arch }} --installer-only
        env:
          DESKTOP_APP_URL: https://workspace.branch.peyyfi.io
          DESKTOP_MAC_IDENTITY: '-'
      - name: Verify architecture, branding and live URL
        run: node desktop/scripts/verify-release.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - if: matrix.arch == 'ia32'
        run: npm --prefix desktop install --no-save --package-lock=false playwright-core@1.64.1
      - if: matrix.arch == 'ia32'
        name: Run the actual 32-bit application
        run: node desktop/scripts/test-packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Publish verified public downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for target in mac-arm64.dmg mac-x64.dmg win-x64.exe win-arm64.exe win-ia32.exe; do
            test -f "installers/Branch-$version-$target"
          done
          (cd installers && sha256sum *.dmg *.exe > SHA256SUMS.txt)
          python - <<'PYCODE'
          from pathlib import Path
          import json, os, urllib.request
          metadata = json.loads(Path('release-input.json').read_text())
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'Branch-Release-Publisher'}
          def api(url, method='GET', data=None, content_type='application/json'):
              request = urllib.request.Request(url, method=method, data=data, headers={**headers, 'Content-Type': content_type})
              with urllib.request.urlopen(request, timeout=120) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          release = api(base + '/releases/' + str(metadata['releaseId']))
          assert release['draft'] is True and release['tag_name'] == os.environ['RELEASE_TAG']
          upload = release['upload_url'].split('{')[0]
          for file in sorted(Path('installers').iterdir()):
              if file.suffix not in ['.dmg', '.exe'] and file.name != 'SHA256SUMS.txt':
                  continue
              existing = next((a for a in release['assets'] if a['name'] == file.name), None)
              if existing:
                  api(base + '/releases/assets/' + str(existing['id']), method='DELETE')
              print('Uploading ' + file.name, flush=True)
              api(upload + '?name=' + file.name, method='POST', data=file.read_bytes(), content_type='application/octet-stream')
          api(base + '/releases/assets/' + str(metadata['inputAssetId']), method='DELETE')
          api(base + '/releases/' + str(metadata['releaseId']), method='PATCH', data=json.dumps({'draft': False, 'make_latest': 'true'}).encode())
          print('Published all five verified installers without requiring customer sign-in.')
          PYCODE
